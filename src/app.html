<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Free Online Metronome - Tap Tempo & Accents | GEM</title>
		<meta
			name="description"
			content="A free online metronome with tap tempo, accented beats, click, wood block and beep sounds, silent and flash modes, and offline support. No ads, no sign-up."
		/>
		<link rel="canonical" href="https://goodmetronome.com/" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Good Enough Metronome" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:title" content="Free Online Metronome - Tap Tempo & Accents | GEM" />
		<meta
			property="og:description"
			content="A free online metronome with tap tempo, accented beats, click, wood block and beep sounds, silent and flash modes, and offline support. No ads, no sign-up."
		/>
		<meta property="og:url" content="https://goodmetronome.com/" />
		<meta property="og:image" content="https://goodmetronome.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Good Enough Metronome - a simple online metronome" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Free Online Metronome - Tap Tempo & Accents | GEM" />
		<meta
			name="twitter:description"
			content="A free online metronome with tap tempo, accented beats, click, wood block and beep sounds, silent and flash modes, and offline support. No ads, no sign-up."
		/>
		<meta name="twitter:image" content="https://goodmetronome.com/og-image.png" />

		<meta name="theme-color" content="#000000" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Good Enough Metronome",
				"alternateName": "GEM",
				"url": "https://goodmetronome.com/",
				"applicationCategory": "MultimediaApplication",
				"operatingSystem": "Web",
				"isAccessibleForFree": true,
				"featureList": [
					"Tempos from 30 to 300 BPM",
					"Tap tempo",
					"2 to 9 beats per bar with custom accents",
					"Click, wood block and beep sounds",
					"Sound, silent and flash modes",
					"Pendulum indicator",
					"Works offline",
					"Remembers your settings"
				],
				"description": "A free online metronome with tap tempo, accented beats, click, wood block and beep sounds, silent and flash modes, and offline support. No ads, no sign-up.",
				"image": "https://goodmetronome.com/icons/icon_512.png",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				}
			}
		</script>

		<script>
			(function () {
				var theme = localStorage.getItem('color-scheme');
				if (theme !== 'light' && theme !== 'dark') {
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('color-scheme', theme);
			})();
		</script>

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon_192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

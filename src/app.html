<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>GEM | Good Enough Metronome</title>
		<meta
			name="description"
			content="GEM (Good Enough Metronome) is a free PWA designed for musicians who need a reliable and easy-to-use metronome. GEM does one thing, and it does it well enough."
		/>
		<link rel="canonical" href="https://goodmetronome.com/" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Good Enough Metronome" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:title" content="GEM | Good Enough Metronome" />
		<meta
			property="og:description"
			content="GEM (Good Enough Metronome) is a free PWA designed for musicians who need a reliable and easy-to-use metronome. GEM does one thing, and it does it well enough."
		/>
		<meta property="og:url" content="https://goodmetronome.com/" />
		<meta property="og:image" content="https://goodmetronome.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Good Enough Metronome - a simple online metronome" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="GEM | Good Enough Metronome" />
		<meta
			name="twitter:description"
			content="GEM (Good Enough Metronome) is a free PWA designed for musicians who need a reliable and easy-to-use metronome. GEM does one thing, and it does it well enough."
		/>
		<meta name="twitter:image" content="https://goodmetronome.com/og-image.png" />

		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffcfa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0908" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Good Enough Metronome",
				"alternateName": "GEM",
				"url": "https://goodmetronome.com/",
				"applicationCategory": "UtilitiesApplication",
				"operatingSystem": "Web",
				"description": "GEM (Good Enough Metronome) is a free PWA designed for musicians who need a reliable and easy-to-use metronome. GEM does one thing, and it does it well enough.",
				"image": "https://goodmetronome.com/icons/icon_512.png",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				}
			}
		</script>

		<script>
			(function () {
				var theme = localStorage.getItem('color-scheme');
				if (theme !== 'light' && theme !== 'dark') {
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('color-scheme', theme);
			})();
		</script>

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon_192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
